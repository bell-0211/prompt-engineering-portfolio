name: validate-portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate public assets
        run: python scripts/validate_assets.py
      - name: Validate structured-agent contract
        run: python scripts/validate_domain_contract.py
      - name: Derive results from deterministic fixtures
        run: python scripts/run_demo.py --output /tmp/results.json
      - name: Assert the intentionally blocked demo decision
        run: python scripts/aggregate_results.py --results /tmp/results.json --expect blocked
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
